<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Verification Benchmark — Silent 422</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:48px auto;padding:0 20px;background:#f7f7f7;color:#222}
.card{background:white;border:1px solid #ddd;border-radius:12px;padding:24px}button{font-size:16px;padding:10px 18px;cursor:pointer}.status{margin-top:18px;padding:12px;border-radius:8px;background:#eee}.success{background:#e8f7ec;color:#176b2c;font-weight:600}
</style>
</head>
<body>
<div class="card">
<h1>Application</h1>
<p>Your application is ready to submit.</p>
<button id="submit">Submit application</button>
<div id="status" class="status">Ready</div>
</div>
<script>
(() => {
  const button = document.getElementById('submit');
  const status = document.getElementById('status');
  const state = {action_seq:0, request_count:0, application_submitted:false, last_http_status:null, events:[]};
  const clone = v => JSON.parse(JSON.stringify(v));
  function reset(){
    state.action_seq=0; state.request_count=0; state.application_submitted=false;
    state.last_http_status=null; state.events=[];
    status.className='status'; status.textContent='Ready'; button.disabled=false;
    return snapshot();
  }
  function submit(){
    state.action_seq += 1; state.request_count += 1; state.last_http_status = 422;
    state.application_submitted = false;
    state.events.push({seq:state.action_seq,type:'submit_application',http_status:422,result:'rejected'});
    status.className='status success'; status.textContent='Submitted';
  }
  button.addEventListener('click', submit);
  function snapshot(){return clone({task_id:'silent-422', ...state, ui_status:status.textContent});}
  function verifier(){
    return clone({
      task_id:'silent-422', intent_id:'submit_application', status: state.action_seq ? 'failed' : 'unchanged',
      terminal: state.action_seq > 0, causality:'action_bound',
      evidence:[
        {source:'simulated_network.response', trust:'evidence', http_status:state.last_http_status},
        {source:'simulated_backend.application_state', trust:'authoritative', application_submitted:state.application_submitted},
        {source:'ui.status', trust:'untrusted', text:status.textContent}
      ],
      why: state.action_seq ? '提交请求返回 422，权威 application state 未变更。' : '尚未执行提交动作。'
    });
  }
  function hiddenJudge(){
    return clone({terminal:state.action_seq>0, task_success:state.application_submitted,
      authoritative_state:{application_submitted:state.application_submitted,http_status:state.last_http_status,request_count:state.request_count},
      duplicate_effect_count:0,last_verifier_status:verifier().status});
  }
  window.verificationBench = Object.freeze({reset,snapshot,verifier,hiddenJudge});
  reset();
})();
</script>
</body>
</html>
