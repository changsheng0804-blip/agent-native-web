<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>前提闭环模拟夹具</title>
</head>
<body>
  <h1>前提失效闭环模拟</h1>
  <p>多步表单任务:填字段A → 填字段B → 勾选C → 确认提交。</p>
  <label>字段A: <input id="field-a" placeholder="字段A"></label><br><br>
  <label>字段B: <input id="field-b" placeholder="字段B"></label><br><br>
  <label>选项C: <input id="opt-c" type="checkbox" aria-label="选项C"></label><br><br>
  <div id="status">等待开始</div>
</body>
</html>
