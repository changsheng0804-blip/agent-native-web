<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>任务运行时表单提交夹具</title>
  <style>
    body { font-family: sans-serif; max-width: 520px; padding: 24px; }
    label { display: block; margin-top: 10px; }
    input { display: block; width: 320px; margin-top: 4px; padding: 7px; }
    button { margin-top: 16px; padding: 8px 24px; }
    #status { min-height: 24px; margin-top: 12px; }
    #challenge-overlay { position: fixed; inset: 0; display: none; place-items: center;
      background: rgba(0, 0, 0, .55); z-index: 9999; }
    #challenge-overlay.show { display: grid; }
    #challenge-box { width: 360px; height: 260px; background: white; }
    #challenge-frame { width: 100%; height: 220px; border: 0; }
  </style>
</head>
<body>
  <h1>资料提交</h1>
  <form id="profile-form">
    <label>姓名<input name="name" placeholder="姓名"></label>
    <label>邮箱<input name="email" type="email" placeholder="邮箱"></label>
    <label>密码<input name="password" type="password" placeholder="密码"></label>
    <button id="submit-profile" type="button" onclick="submitProfile()">提交资料</button>
  </form>
  <div id="status" aria-live="polite"></div>

  <div id="challenge-overlay" aria-hidden="true">
    <div id="challenge-box">
      <strong>需要完成验证</strong>
      <iframe id="challenge-frame" srcdoc="<html><body><p>这是验证区域</p></body></html>"></iframe>
    </div>
  </div>

  <script>
    const mode = new URLSearchParams(location.search).get('mode') || 'ok';
    function submitProfile() {
      if (mode === 'error') {
        // 故意不改变页面，交由服务端的 HTTP 错误监听器识别失败。
        fetch('/api/submit-profile?mode=error', { method: 'POST' }).catch(() => {});
        return;
      }
      if (mode === 'challenge') {
        event.target.querySelectorAll('input').forEach(input => input.value = '');
        const overlay = document.getElementById('challenge-overlay');
        overlay.classList.add('show');
        overlay.setAttribute('aria-hidden', 'false');
        document.getElementById('status').textContent = '完成验证后才能继续';
        return;
      }
      document.getElementById('status').textContent = '资料已提交';
      const dialog = document.createElement('dialog');
      dialog.id = 'submit-success';
      dialog.setAttribute('open', '');
      dialog.textContent = '提交成功';
      document.body.appendChild(dialog);
    }
  </script>
</body>
</html>
