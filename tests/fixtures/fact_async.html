<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数据导出</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #f6f7f9; margin: 0; padding: 40px 20px; }
  .card { max-width: 440px; margin: 0 auto; background: #fff; border: 1px solid #e3e6ea;
          border-radius: 10px; padding: 28px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  h1 { font-size: 18px; margin: 0 0 6px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 18px; }
  button { width: 100%; padding: 11px; background: #2563eb; color: #fff;
           border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button:disabled { background: #93b4f5; }
  .panel { margin-top: 20px; padding: 12px; background: #f9fafb; border: 1px solid #e5e7eb;
           border-radius: 6px; font-size: 13px; color: #374151; }
  .panel .live { font-weight: 600; }
  #status { margin-top: 14px; font-size: 14px; min-height: 20px; }
  .ok { color: #15803d; }
</style>
</head>
<body>
  <div class="card">
    <h1>数据导出</h1>
    <div class="sub">导出完成后会通过邮件发送下载链接</div>

    <button id="submit">开始导出</button>
    <div id="status"></div>

    <div class="panel">
      任务状态:<span class="live" id="task-state">—</span><br>
      任务编号:<span class="live" id="task-id">—</span><br>
      提交时间:<span class="live" id="submit-time">—</span>
    </div>
  </div>

  <script>
    // 点击后:
    //   1. 页面出现明显变化(状态文案 + 任务编号 + 时间)——所以工具会判"已生效"
    //   2. POST /api/export 返回 202(排队中)
    //   3. 3 秒后服务端任务实际失败(前端不轮询,页面永远显示"已提交")
    //
    // 也就是说:动作本身确实生效了(页面变了、请求也成功受理),
    // 但**任务的最终结果**不在页面的任何观察里。
    document.getElementById('submit').addEventListener('click', function () {
      var btn = this;
      var st = document.getElementById('status');
      btn.disabled = true;
      btn.textContent = '已提交';

      fetch('/api/export', { method: 'POST' }).catch(function () {});

      st.className = 'ok';
      st.textContent = '✅ 导出任务已提交,完成后会邮件通知你。';
      document.getElementById('task-state').textContent = '排队中';
      document.getElementById('task-id').textContent = 'EXP-20481';
      document.getElementById('submit-time').textContent =
        new Date().toLocaleTimeString('zh-CN', { hour12: false });
    });
  </script>
</body>
</html>
