<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Verification Benchmark — Optimistic Rollback</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:48px auto;padding:0 20px;background:#f7f7f7;color:#222}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:24px}.row{display:flex;gap:12px;align-items:center;margin:18px 0}button{font-size:16px;padding:10px 18px;cursor:pointer}.status{margin-top:18px;padding:12px;border-radius:8px;background:#eee}.success{background:#e8f7ec;color:#176b2c}.error{background:#fdecec;color:#8a1c1c}.pending{background:#fff6d9;color:#765b00}
</style>
</head>
<body>
<div class="card">
<h1>Notification settings</h1>
<div class="row"><input id="notifications" type="checkbox"><label for="notifications">Enable notifications</label></div>
<button id="save">Save settings</button>
<div id="status" class="status">Not saved</div>
</div>
<script>
(() => {
  const checkbox=document.getElementById('notifications');
  const button=document.getElementById('save');
  const status=document.getElementById('status');
  let timer=null;
  const state={action_seq:0,attempt:0,backend_status:'idle',notifications_enabled:false,persisted:false,pending_since:null,events:[]};
  const clone=v=>JSON.parse(JSON.stringify(v));
  function setStatus(text,cls=''){status.textContent=text;status.className='status '+cls;}
  function reset(){
    if(timer){clearTimeout(timer);timer=null;}
    Object.assign(state,{action_seq:0,attempt:0,backend_status:'idle',notifications_enabled:false,persisted:false,pending_since:null,events:[]});
    checkbox.checked=false;button.disabled=false;setStatus('Not saved');
    return snapshot();
  }
  function save(){
    if(state.backend_status==='pending') return;
    state.action_seq+=1; state.attempt+=1; state.backend_status='pending'; state.pending_since=Date.now();
    const desired=checkbox.checked===true;
    state.events.push({seq:state.action_seq,type:'save_settings',attempt:state.attempt,desired});
    if(state.attempt===1){
      setStatus('Saved','success');
      timer=setTimeout(()=>{
        state.backend_status='failed'; state.persisted=false; state.notifications_enabled=false; state.pending_since=null;
        state.events.push({seq:state.action_seq,type:'rollback',reason:'simulated_backend_reject'});
        setStatus('Save failed — retry available','error'); timer=null;
      },1800);
    } else {
      setStatus('Saving…','pending');
      timer=setTimeout(()=>{
        state.backend_status='committed'; state.persisted=true; state.notifications_enabled=desired; state.pending_since=null;
        state.events.push({seq:state.action_seq,type:'commit',notifications_enabled:desired});
        setStatus(desired?'Saved':'Saved (notifications disabled)','success'); timer=null;
      },650);
    }
  }
  button.addEventListener('click',save);
  function snapshot(){return clone({task_id:'optimistic-rollback',...state,ui_status:status.textContent,ui_checkbox:checkbox.checked});}
  function verifier(){
    let verdict='unchanged';
    if(state.backend_status==='pending') verdict='pending';
    else if(state.backend_status==='failed') verdict='failed';
    else if(state.backend_status==='committed') verdict='committed';
    return clone({task_id:'optimistic-rollback',intent_id:'save_notification_setting',status:verdict,
      terminal:['failed','committed'].includes(verdict),causality:'action_bound',
      evidence:[
        {source:'simulated_backend.settings_store',trust:'authoritative',backend_status:state.backend_status,persisted:state.persisted,notifications_enabled:state.notifications_enabled},
        {source:'ui.status',trust:'untrusted',text:status.textContent},
        {source:'ui.checkbox',trust:'evidence',checked:checkbox.checked}
      ],
      why: verdict==='pending'?'保存仍在处理中，不能确认最终持久化。':verdict==='failed'?'第一次保存已回滚，权威设置未持久化。':verdict==='committed'?'权威设置存储已提交。':'尚未执行保存动作。'});
  }
  function hiddenJudge(){
    const success=state.persisted===true&&state.notifications_enabled===true&&state.backend_status==='committed';
    return clone({terminal:['failed','committed'].includes(state.backend_status),task_success:success,
      authoritative_state:{backend_status:state.backend_status,notifications_enabled:state.notifications_enabled,persisted:state.persisted,attempt:state.attempt},
      duplicate_effect_count:0,last_verifier_status:verifier().status});
  }
  window.verificationBench=Object.freeze({reset,snapshot,verifier,hiddenJudge});
  reset();
})();
</script>
</body>
</html>
