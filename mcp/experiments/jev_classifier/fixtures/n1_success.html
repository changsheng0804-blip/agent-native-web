<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>活动报名</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  form { max-width: 360px; }
  input { display: block; width: 100%; margin: 6px 0; padding: 6px; box-sizing: border-box; }
  button.submit { margin-top: 10px; padding: 8px 24px; cursor: pointer; }
  #ok { display: none; margin-top: 14px; color: #1a7f37; font-weight: bold; }
  #ok.show { display: block; }
</style>
</head>
<body>
  <h1>活动报名</h1>
  <form id="signup">
    <input name="name" type="text" placeholder="姓名" value="">
    <input name="phone" type="text" placeholder="手机号" value="">
    <button type="submit" class="submit" id="go">提交</button>
  </form>

  <div id="ok">✅ 报名成功,我们将在 3 个工作日内联系你。</div>

  <script>
    document.getElementById('signup').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('ok').classList.add('show');
    });
  </script>
</body>
</html>
