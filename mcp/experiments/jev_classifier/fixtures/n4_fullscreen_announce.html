<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>资料提交</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  form { max-width: 360px; }
  input { display: block; width: 100%; margin: 6px 0; padding: 6px; box-sizing: border-box; }
  button.submit { margin-top: 10px; padding: 8px 24px; cursor: pointer; }
  #announce { position: fixed; inset: 0; background: rgba(20,40,80,0.82); z-index: 9999; display: none; align-items: center; justify-content: center; }
  #announce.show { display: flex; }
  #announce .panel { width: 460px; background: #fff; border-radius: 8px; padding: 24px; }
</style>
</head>
<body>
  <h1>资料提交</h1>
  <form id="submit-doc">
    <input name="title" type="text" placeholder="资料标题" value="">
    <button type="submit" class="submit" id="go">提交</button>
  </form>

  <div id="announce">
    <div class="panel">
      <h2>系统公告</h2>
      <p>本服务将于今晚 23:00 - 24:00 进行例行维护,期间可能无法访问,请提前保存工作。</p>
      <p><button onclick="document.getElementById('announce').classList.remove('show')">我知道了</button></p>
    </div>
  </div>

  <script>
    document.getElementById('submit-doc').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('announce').classList.add('show');
    });
  </script>
</body>
</html>
