<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>反馈提交</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  form { max-width: 360px; }
  input, textarea { display: block; width: 100%; margin: 6px 0; padding: 6px; box-sizing: border-box; }
  button.submit { margin-top: 10px; padding: 8px 24px; cursor: pointer; }
  #captcha-widget { position: fixed; right: 16px; bottom: 16px; width: 340px; height: 260px; background: #fff; border: 1px solid #ccc; box-shadow: 0 4px 16px rgba(0,0,0,.2); border-radius: 8px; padding: 14px; display: none; }
  #captcha-widget.show { display: block; }
</style>
</head>
<body>
  <h1>提交反馈</h1>
  <form id="fb">
    <textarea placeholder="请描述你遇到的问题"></textarea>
    <button type="submit" class="submit" id="go">提交</button>
  </form>

  <div id="captcha-widget">
    <p><strong>请确认您是真人</strong></p>
    <p><label><input type="checkbox"> 我不是机器人</label></p>
    <p style="color:#888;font-size:13px">完成勾选后继续提交</p>
  </div>

  <script>
    document.getElementById('fb').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('captcha-widget').classList.add('show');
    });
  </script>
</body>
</html>
