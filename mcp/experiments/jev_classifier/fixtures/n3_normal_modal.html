<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>售后申请</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  form { max-width: 360px; }
  input { display: block; width: 100%; margin: 6px 0; padding: 6px; box-sizing: border-box; }
  button.submit { margin-top: 10px; padding: 8px 24px; cursor: pointer; }
  #dlg { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 360px; background: #fff; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.25); padding: 18px; z-index: 999; }
  #dlg.show { display: block; }
</style>
</head>
<body>
  <h1>售后申请</h1>
  <form id="refund">
    <input name="order_no" type="text" placeholder="订单号" value="">
    <button type="submit" class="submit" id="go">提交</button>
  </form>

  <div id="dlg" role="dialog" aria-modal="true">
    <h3>订单确认</h3>
    <p>已收到你的售后申请,编号 #12345。</p>
    <p>客服将在 24 小时内处理。</p>
  </div>

  <script>
    document.getElementById('refund').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('dlg').classList.add('show');
    });
  </script>
</body>
</html>
