name: 工程验收

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: 离线验收 (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: 按锁定清单安装依赖
        run: |
          python -m pip install -r 依赖锁定-requirements.txt
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: 工程一致性与正确性检查
        run: |
          python scripts/工程治理-check.py
          python -m ruff check mcp scripts
          node --check extension/all-in-one.js
      - name: 完整离线门禁（包含零假成功验证）
        run: python mcp/run_quality.py --parallel 3 --report .治理证据-evidence/离线验收-quality.md
      - name: 保存验收证据
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 离线验收-python-${{ matrix.python }}
          path: |
            .治理证据-evidence/*.md
            mcp/validate_report.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  acceptance:
    name: 工程验收
    if: ${{ always() }}
    needs: offline
    runs-on: ubuntu-latest
    steps:
      - name: 核对全部验收结果
        env:
          RESULT: ${{ needs.offline.result }}
        run: test "$RESULT" = success
