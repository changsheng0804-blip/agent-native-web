name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        run: |
          pip install mcp playwright pillow
          playwright install --with-deps chromium
      - name: 扩展内核合并文件语法检查
        run: node --check extension/all-in-one.js
      - name: 门禁冒烟(协议收口)
        run: python mcp/run_quality.py --only test_protocol.py
      - name: 门禁冒烟(小票标准)
        run: python mcp/run_quality.py --only test_receipt.py
