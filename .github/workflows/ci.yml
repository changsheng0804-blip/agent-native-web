name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        run: |
          pip install "mcp>=1.29,<2" playwright pillow
          playwright install --with-deps chromium
      - name: 扩展内核合并文件语法检查
        run: node --check extension/all-in-one.js
      - name: ruff 正确性检查
        run: |
          pip install ruff
          ruff check mcp
      - name: 门禁冒烟(协议收口)
        run: python mcp/run_quality.py --only test_protocol.py --report mcp/quality_protocol.md
      - name: 门禁冒烟(小票标准)
        if: ${{ !cancelled() }}
        run: python mcp/run_quality.py --only test_receipt.py --report mcp/quality_receipt.md
      - name: 上传门禁报告(失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: mcp/quality_*.md
          if-no-files-found: ignore
