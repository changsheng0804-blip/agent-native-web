name: 问题反馈
description: 提供可以复现的问题与预期结果
title: '[缺陷] '
labels: ['缺陷']
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与预期结果
      description: 请提供最小步骤、实际结果和希望得到的结果，勿粘贴凭据或真实用户数据。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 版本与环境
      description: 提交编号、系统、Python 和浏览器版本，以及可分享的错误信息。
    validations:
      required: true
