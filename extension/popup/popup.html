<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Runtime Adapter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 360px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #e0e0e0;
      font-size: 13px;
    }
    
    .header {
      padding: 16px;
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .header h1 {
      font-size: 16px;
      color: #4fc3f7;
      margin-bottom: 4px;
    }
    
    .header .version {
      font-size: 11px;
      color: #888;
    }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 16px;
    }
    
    .stat-card {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 12px 8px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #4fc3f7;
    }
    
    .stat-label {
      font-size: 10px;
      color: #888;
      margin-top: 4px;
      text-transform: uppercase;
    }
    
    .health-score {
      margin: 0 16px 16px;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
    }
    
    .health-score .label {
      font-size: 11px;
      color: #888;
      margin-bottom: 8px;
    }
    
    .health-bar {
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    
    .health-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    
    .search-section {
      padding: 0 16px 16px;
    }
    
    .search-input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .search-input:focus {
      border-color: #4fc3f7;
    }
    
    .search-input::placeholder {
      color: #666;
    }
    
    .overlay-modes {
      padding: 0 16px 16px;
    }
    
    .section-title {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    
    .mode-btn {
      padding: 8px 4px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #aaa;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .mode-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    
    .mode-btn.active {
      background: rgba(79, 195, 247, 0.2);
      border-color: #4fc3f7;
      color: #4fc3f7;
    }
    
    .actions {
      padding: 0 16px 16px;
      display: flex;
      gap: 8px;
    }
    
    .action-btn {
      flex: 1;
      padding: 10px;
      background: rgba(79, 195, 247, 0.15);
      border: 1px solid rgba(79, 195, 247, 0.3);
      border-radius: 6px;
      color: #4fc3f7;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .action-btn:hover {
      background: rgba(79, 195, 247, 0.25);
    }
    
    .results {
      margin: 0 16px 16px;
      max-height: 150px;
      overflow-y: auto;
      background: rgba(0,0,0,0.3);
      border-radius: 6px;
      display: none;
    }
    
    .results.show {
      display: block;
    }
    
    .result-item {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 12px;
    }
    
    .result-item:last-child {
      border-bottom: none;
    }
    
    .result-item .semantic {
      color: #4fc3f7;
      font-size: 10px;
    }
    
    .result-item .text {
      color: #ccc;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .no-results {
      padding: 16px;
      text-align: center;
      color: #666;
    }
    
    .footer {
      padding: 12px 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
      text-align: center;
      font-size: 10px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔮 Agent Runtime</h1>
    <div class="version">v1.0.0 - 将网页翻译成 Agent 世界</div>
  </div>
  
  <div class="stats">
    <div class="stat-card">
      <div class="stat-value" id="stat-elements">-</div>
      <div class="stat-label">元素数</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-interactive">-</div>
      <div class="stat-label">交互</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-regions">-</div>
      <div class="stat-label">空白区</div>
    </div>
  </div>
  
  <div class="health-score">
    <div class="label">布局健康度</div>
    <div class="health-bar">
      <div class="health-fill" id="health-fill" style="width: 0%; background: #4fc3f7;"></div>
    </div>
  </div>
  
  <div class="search-section">
    <input type="text" class="search-input" id="search-input" placeholder="搜索语义角色，如: button, navigation, card...">
  </div>
  
  <div class="results" id="search-results">
    <div class="no-results" id="no-results">输入角色名搜索元素</div>
  </div>
  
  <div class="overlay-modes">
    <div class="section-title">可视化覆盖层</div>
    <div class="mode-grid">
      <button class="mode-btn" data-mode="grid">📐 网格</button>
      <button class="mode-btn" data-mode="elements">📦 元素</button>
      <button class="mode-btn" data-mode="regions">⬜ 空白区</button>
      <button class="mode-btn" data-mode="density">🔥 密度</button>
      <button class="mode-btn" data-mode="all">✨ 全部</button>
      <button class="mode-btn active" data-mode="off">❌ 关闭</button>
    </div>
  </div>
  
  <div class="actions">
    <button class="action-btn" id="refresh-btn">🔄 刷新</button>
    <button class="action-btn" id="export-btn">📥 导出 JSON</button>
  </div>
  
  <div class="footer">
    基于 Window.agentWorld API 构建
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
